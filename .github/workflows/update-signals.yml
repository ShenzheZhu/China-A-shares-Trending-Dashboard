name: Update Trading Signals

on:
  schedule:
    # 每天北京时间15:35运行（收盘后）
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Install dependencies
        run: uv sync
      
      - name: Generate signals
        run: uv run python generate_signals.py
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web/public/data/signals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update signals $(date +%Y-%m-%d)" && git push)
